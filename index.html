<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doublefree Tags</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#FAF8F4;--fg:#1E1C19;--muted:#5E5A54;--line:#E6E1D8;--accent:#2E4A7D;--surface:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--bg:#16171A;--fg:#ECE8E1;--muted:#A39E95;--line:#34353B;--accent:#9DB5E3;--surface:#1F2024;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h1{font:700 28px/1.15 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
p{margin:0;color:var(--muted)}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:15px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);text-transform:uppercase}
button{font:600 15px Inter,sans-serif;padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);cursor:pointer}
a.card{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none}
a.card b{display:block}
a.card span{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Doublefree Tags</h1>
  <p>Type the ID printed on a tag to see who made the piece, from what, and what they were paid.</p>
  <form id="f"><label for="id" hidden>Passport ID</label><input id="id" placeholder="DF-CRO-26-0001" autocomplete="off"><button>Open</button></form>
  <a class="card" href="DF-CRO-26-0001/"><b>DF-CRO-26-0001</b><span>Striped crochet cardigan · Pune · sample</span></a>
</main>
<script>
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const id = document.getElementById("id").value.trim().toUpperCase();
  if (/^DF-[A-Z]{3}-\d{2}-\d{4}$/.test(id)) location.href = id + "/";
});
</script>
</body>
</html>
